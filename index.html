<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Feng Shui Floor Planner</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f5e8d3;
            color: #4a3728;
        }
        h1 {
            color: #6d4c41;
            margin-bottom: 20px;
        }
        #controls {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        select, button {
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #8d6e63;
            color: #f5e8d3;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        select:hover, button:hover {
            background-color: #6d4c41;
        }
        #room {
            border: 2px solid #6d4c41;
            position: relative;
            margin: 20px;
            background-color: #e0d0c0;
            box-shadow: 0 0 10px rgba(74, 55, 40, 0.1);
        }
        .furniture, .door, .window, .rug {
            position: absolute;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            user-select: none;
            border: 1px solid #6d4c41;
            box-shadow: 0 0 5px rgba(74, 55, 40, 0.2);
            transition: box-shadow 0.3s;
        }
        .furniture:hover, .door:hover, .window:hover {
            box-shadow: 0 0 10px rgba(74, 55, 40, 0.4);
        }
        .rug {
            z-index: -1;
            border: 2px dashed #795548;
            background-color: rgba(121, 85, 72, 0.2);
        }
        #furniture-list {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .furniture-item {
            padding: 10px;
            border: 1px solid #a1887f;
            border-radius: 5px;
            cursor: move;
            background-color: #d7ccc8;
            transition: background-color 0.3s;
            color: #4a3728;
        }
        .furniture-item:hover {
            background-color: #bcaaa4;
        }
        #analysis {
            width: 500px;
            height: 200px;
            border: 1px solid #a1887f;
            border-radius: 5px;
            padding: 10px;
            margin-top: 20px;
            overflow-y: auto;
            background-color: #f5e8d3;
        }
        .resize-handle {
            width: 10px;
            height: 10px;
            background-color: #8d6e63;
            position: absolute;
            right: -5px;
            bottom: -5px;
            cursor: se-resize;
        }
        .rotate-handle {
            width: 15px;
            height: 15px;
            background-color: #6d4c41;
            position: absolute;
            left: -7px;
            top: -7px;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>AI Feng Shui Floor Planner</h1>
    
    <div id="controls">
        <select id="room-shape" onchange="changeRoomShape()">
            <option value="square">Square Room</option>
            <option value="rectangle">Rectangular Room</option>
        </select>

        <button onclick="addDoorWindow('door')">Add Door</button>
        <button onclick="addDoorWindow('window')">Add Window</button>
        <button onclick="analyze()">Analyze Feng Shui</button>
    </div>

    <div id="furniture-list">
        <div class="furniture-item" draggable="true" data-type="bed">Bed</div>
        <div class="furniture-item" draggable="true" data-type="table">Table</div>
        <div class="furniture-item" draggable="true" data-type="chair">Chair</div>
        <div class="furniture-item" draggable="true" data-type="sofa">Sofa</div>
        <div class="furniture-item" draggable="true" data-type="tv">TV</div>
        <div class="furniture-item" draggable="true" data-type="cupboard">Cupboard</div>
        <div class="furniture-item" draggable="true" data-type="rug">Rug</div>
    </div>

    <div id="room"></div>

    <div id="analysis"></div>

    <script>
        const room = document.getElementById('room');
        const furnitureItems = document.querySelectorAll('.furniture-item');
        const analysis = document.getElementById('analysis');
        let draggedElement = null;
        let resizingElement = null;
        let rotatingElement = null;
        let startX, startY, startWidth, startHeight, startAngle;

        changeRoomShape();

        furnitureItems.forEach(item => {
            item.addEventListener('dragstart', dragStart);
        });

        room.addEventListener('dragover', dragOver);
        room.addEventListener('drop', drop);
        room.addEventListener('mousedown', startDragging);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', stopDragging);

        function changeRoomShape() {
            const shape = document.getElementById('room-shape').value;
            if (shape === 'square') {
                room.style.width = '500px';
                room.style.height = '500px';
            } else {
                room.style.width = '700px';
                room.style.height = '500px';
            }
        }

        function dragStart(e) {
            e.dataTransfer.setData('text/plain', e.target.dataset.type);
        }

        function dragOver(e) {
            e.preventDefault();
        }

        function drop(e) {
            e.preventDefault();
            const furnitureType = e.dataTransfer.getData('text');
            addFurniture(furnitureType, e.offsetX, e.offsetY);
        }

        function addFurniture(type, x, y) {
            const furniture = document.createElement('div');
            furniture.className = type === 'door' || type === 'window' ? type : (type === 'rug' ? 'rug' : 'furniture');
            furniture.style.left = `${x}px`;
            furniture.style.top = `${y}px`;
            furniture.style.width = type === 'door' ? '10px' : '60px';
            furniture.style.height = type === 'window' ? '10px' : '60px';
            furniture.style.backgroundColor = getColor(type);
            furniture.textContent = type;

            if (type !== 'rug') {
                const resizeHandle = document.createElement('div');
                resizeHandle.className = 'resize-handle';
                furniture.appendChild(resizeHandle);
            }

            if (type === 'door' || type === 'window') {
                const rotateHandle = document.createElement('div');
                rotateHandle.className = 'rotate-handle';
                furniture.appendChild(rotateHandle);
            }

            room.appendChild(furniture);
        }

        function getColor(type) {
            const colors = {
                bed: '#a1887f',
                table: '#8d6e63',
                chair: '#795548',
                sofa: '#6d4c41',
                tv: '#5d4037',
                cupboard: '#4e342e',
                door: '#3e2723',
                window: '#bcaaa4'
            };
            return colors[type] || '#d7ccc8';
        }

        function addDoorWindow(type) {
            addFurniture(type, 0, 0);
        }

        function startDragging(e) {
            if (e.target.classList.contains('resize-handle')) {
                resizingElement = e.target.parentElement;
                startX = e.clientX;
                startY = e.clientY;
                startWidth = parseInt(resizingElement.style.width, 10);
                startHeight = parseInt(resizingElement.style.height, 10);
            } else if (e.target.classList.contains('rotate-handle')) {
                rotatingElement = e.target.parentElement;
                const rect = rotatingElement.getBoundingClientRect();
                startAngle = Math.atan2(e.clientY - (rect.top + rect.height / 2), e.clientX - (rect.left + rect.width / 2));
            } else if (e.target.classList.contains('furniture') || 
                       e.target.classList.contains('door') || 
                       e.target.classList.contains('window') ||
                       e.target.classList.contains('rug')) {
                draggedElement = e.target;
                draggedElement.style.zIndex = 1000;
            }
        }

        function drag(e) {
            if (resizingElement) {
                const width = startWidth + e.clientX - startX;
                const height = startHeight + e.clientY - startY;
                resizingElement.style.width = `${Math.max(20, width)}px`;
                resizingElement.style.height = `${Math.max(20, height)}px`;
            } else if (rotatingElement) {
                const rect = rotatingElement.getBoundingClientRect();
                const angle = Math.atan2(e.clientY - (rect.top + rect.height / 2), e.clientX - (rect.left + rect.width / 2));
                const rotation = angle - startAngle;
                rotatingElement.style.transform = `rotate(${rotation}rad)`;
            } else if (draggedElement) {
                const rect = room.getBoundingClientRect();
                let newX = e.clientX - rect.left - draggedElement.offsetWidth / 2;
                let newY = e.clientY - rect.top - draggedElement.offsetHeight / 2;

                newX = Math.max(0, Math.min(newX, rect.width - draggedElement.offsetWidth));
                newY = Math.max(0, Math.min(newY, rect.height - draggedElement.offsetHeight));

                draggedElement.style.left = `${newX}px`;
                draggedElement.style.top = `${newY}px`;
            }
        }

        function stopDragging() {
            if (draggedElement) {
                draggedElement.style.zIndex = '';
                draggedElement = null;
            }
            resizingElement = null;
            rotatingElement = null;
        }

        function analyze() {
            const furnitureCount = room.querySelectorAll('.furniture').length;
            const doorCount = room.querySelectorAll('.door').length;
            const windowCount = room.querySelectorAll('.window').length;
            const rugCount = room.querySelectorAll('.rug').length;
            const shape = document.getElementById('room-shape').value;

            let fengShuiScore = 100;
            let advice = "Based on our AI Feng Shui analysis:\n\n";

            // Door analysis
            if (doorCount === 0) {
                advice += "- There's no door in your room. Every room needs at least one door for energy flow.\n";
                fengShuiScore -= 30;
            } else if (doorCount > 1) {
                advice += "- Multiple doors can create conflicting energy flows. Consider reducing to one main door if possible.\n";
                fengShuiScore -= 10 * (doorCount - 1);
            }

            // Window analysis
            if (windowCount === 0) {
                advice += "- No windows detected. Windows are crucial for natural light and air circulation.\n";
                fengShuiScore -= 20;
            } else if (windowCount > 3) {
                advice += "- Too many windows might lead to energy dispersion. Balance is key.\n";
                fengShuiScore -= 5 * (windowCount - 3);
            }

            // Furniture analysis
            if (furnitureCount < 3) {
                advice += "- The room feels empty. Add more furniture for balance and functionality.\n";
                fengShuiScore -= 15;
            } else if (furnitureCount > 7) {
                advice += "- The room might be overcrowded. Consider removing some furniture for better energy flow.\n";
                fengShuiScore -= 5 * (furnitureCount - 7);
            }

            // Rug analysis
            if (rugCount > 0) {
                advice += "- The rug adds warmth and defines spaces. Ensure it's proportional to the room size.\n";
            }

            // Shape analysis
            if (shape === 'square') {
                advice += "- Square rooms are excellent for Feng Shui as they represent stability and balance.\n";
            } else {
                advice += "- Rectangular rooms can be good, but ensure the length isn't more than twice the width for optimal energy flow.\n";
            }

            // General advice
            advice += "\nGeneral tips:\n";
            advice += "- Ensure the bed is not directly in line with the door.\n";
            advice += "- Place the largest furniture pieces against solid walls.\n";
            advice += "- Keep the center of the room open for energy circulation.\n";
            advice += "- Balance the five elements: Wood, Fire, Earth, Metal, and Water in your decor.\n";
            advice += "- Position the TV where it doesn't dominate the room's energy.\n";
            advice += "- Use the cupboard to reduce clutter and promote positive energy flow.\n";

            advice += `\nYour Feng Shui score: ${Math.max(0, fengShuiScore)}/100`;

            analysis.innerHTML = advice.replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
